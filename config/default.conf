server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    client_max_body_size 10485760;
    error_page 404 ./www/404.html;

    location / {
        root ./www;
        index index.html;
        methods GET,POST,DELETE;
        cgi_ext .py;
        autoindex on;
    }
}